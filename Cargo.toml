[workspace]
members = [".", "crates/core", "crates/daemon-protocol", "crates/daemon-client", "crates/storage", "crates/context", "crates/memory", "crates/sandbox", "crates/runtime", "crates/daemon", "crates/entry-support", "crates/cli", "crates/acp", "crates/gateway"]
resolver = "3"

[package]
name = "my-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "个人使用的轻量 Rust AI 编码 Agent"

[dependencies]
agent-gateway = { version = "=0.1.0", path = "crates/gateway" }
agent-acp = { version = "=0.1.0", path = "crates/acp" }
agent-cli = { version = "=0.1.0", path = "crates/cli" }
agent-entry-support = { version = "=0.1.0", path = "crates/entry-support" }
agent-daemon = { version = "=0.1.0", path = "crates/daemon" }
agent-runtime = { version = "=0.1.0", path = "crates/runtime" }
agent-memory = { version = "=0.1.0", path = "crates/memory" }
agent-context = { version = "=0.1.0", path = "crates/context" }
agent-daemon-client = { version = "=0.1.0", path = "crates/daemon-client" }
agent-core = { version = "=0.1.0", path = "crates/core" }
anyhow = "1"
async-trait = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
agent-daemon-protocol = { version = "=0.1.0", path = "crates/daemon-protocol" }
futures-util = { version = "0.3", features = ["sink"] }
rusqlite = { version = "0.37", features = ["bundled"] }
agent-daemon = { version = "=0.1.0", path = "crates/daemon", features = ["test-support"] }
agent-runtime = { version = "=0.1.0", path = "crates/runtime", features = ["test-support"] }
agent-storage = { version = "=0.1.0", path = "crates/storage", features = ["test-support"] }
agent-daemon-client = { version = "=0.1.0", path = "crates/daemon-client", features = ["test-transport"] }
syn = { version = "2", features = ["full", "visit"] }
toml = "0.8"
tokio-tungstenite = "=0.29.0"
rcgen = "=0.13.2"
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }
