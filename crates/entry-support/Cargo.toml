[package]
name = "agent-entry-support"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
agent-daemon-client = { version = "=0.1.0", path = "../daemon-client" }
agent-daemon-protocol = { version = "=0.1.0", path = "../daemon-protocol" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time", "process"] }
