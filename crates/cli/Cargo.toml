[package]
name = "agent-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
agent-core = { version = "=0.1.0", path = "../core" }
agent-daemon-client = { version = "=0.1.0", path = "../daemon-client" }
agent-daemon-protocol = { version = "=0.1.0", path = "../daemon-protocol" }
agent-entry-support = { version = "=0.1.0", path = "../entry-support" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"
tracing = "0.1"
futures-util = "0.3"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
crossterm = "=0.29.0"
ratatui = "=0.30.2"
unicode-width = "=0.2.2"
unicode-segmentation = "=1.13.3"
tokio = { version = "1", features = ["io-util", "io-std", "macros", "rt", "signal", "sync", "time"] }

[dev-dependencies]
agent-daemon = { version = "=0.1.0", path = "../daemon", features = ["test-support"] }
agent-runtime = { version = "=0.1.0", path = "../runtime", features = ["test-support"] }
agent-daemon-client = { version = "=0.1.0", path = "../daemon-client", features = ["test-transport"] }
async-trait = "0.1"
