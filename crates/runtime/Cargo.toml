[package]
name = "agent-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[features]
test-support = []

[dependencies]
agent-sandbox = { version = "=0.1.0", path = "../sandbox" }
agent-memory = { version = "=0.1.0", path = "../memory" }
agent-context = { version = "=0.1.0", path = "../context" }
agent-storage = { version = "=0.1.0", path = "../storage" }
agent-core = { version = "=0.1.0", path = "../core" }
agent-daemon-protocol = { version = "=0.1.0", path = "../daemon-protocol" }
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
cron = "=0.17.0"
futures-util = { version = "0.3", features = ["sink"] }
lopdf = { version = "0.45", default-features = false }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
serde_yaml_ng = "=0.10.0"
semver = { version = "=1.0.28", features = ["serde"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
jsonschema = { version = "=0.33.0", default-features = false }
rustix = { version = "=1.1.4", features = ["fs"] }

[dev-dependencies]
agent-storage = { version = "=0.1.0", path = "../storage", features = ["test-support"] }
rcgen = "=0.13.2"
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", features = ["apple-native"] }
