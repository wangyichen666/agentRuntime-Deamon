[package]
name = "agent-identity"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
agent-core = { version = "=0.1.0", path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
jsonwebtoken = "=9.3.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["sync", "time", "net"] }
rustix = { version = "1", features = ["fs"] }
thiserror = "2"
argon2 = "=0.5.3"
getrandom = "0.3"
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "net"] }
