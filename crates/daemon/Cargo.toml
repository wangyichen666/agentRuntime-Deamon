[package]
name = "agent-daemon"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[features]
test-support = ["agent-runtime/test-support", "agent-storage/test-support", "dep:agent-daemon-client"]

[dependencies]
agent-runtime = { version = "=0.1.0", path = "../runtime" }
agent-sandbox = { version = "=0.1.0", path = "../sandbox" }
agent-storage = { version = "=0.1.0", path = "../storage" }
agent-core = { version = "=0.1.0", path = "../core" }
agent-daemon-protocol = { version = "=0.1.0", path = "../daemon-protocol" }
agent-context = { version = "=0.1.0", path = "../context" }
agent-memory = { version = "=0.1.0", path = "../memory" }
agent-daemon-client = { version = "=0.1.0", path = "../daemon-client", optional = true, features = ["test-transport"] }
anyhow = "1"
base64 = "0.22"
thiserror = "2"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "net", "process", "rt-multi-thread", "signal", "sync", "time", "macros"] }
tracing = "0.1"

[dev-dependencies]
agent-runtime = { version = "=0.1.0", path = "../runtime", features = ["test-support"] }
agent-storage = { version = "=0.1.0", path = "../storage", features = ["test-support"] }
agent-daemon-client = { version = "=0.1.0", path = "../daemon-client", features = ["test-transport"] }
