[package]
name = "agent-sandbox"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
agent-core = { version = "=0.1.0", path = "../core" }
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["io-util", "process", "sync", "time", "rt", "macros"] }
rustix = { version = "=1.1.4", features = ["process"] }
tracing = "0.1"
