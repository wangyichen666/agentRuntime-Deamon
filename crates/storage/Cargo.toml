[package]
name = "agent-storage"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[features]
test-support = []

[dependencies]
libc = "0.2"
agent-core = { version = "=0.1.0", path = "../core" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
