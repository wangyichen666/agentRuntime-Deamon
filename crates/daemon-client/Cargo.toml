[package]
name = "agent-daemon-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[features]
test-transport = []

[dependencies]
agent-daemon-protocol = { version = "=0.1.0", path = "../daemon-protocol" }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }
